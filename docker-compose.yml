version: '3.8'

services:
  # 1. VitaTrack Express REST API Backend (Connected to MongoDB Atlas)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: vitatrack-backend
    restart: always
    ports:
      - "4000:4000"
    # Sabhi sensitive keys aur Atlas MONGO_URI seedhe .env file se load honge
    env_file:
      - .env
    environment:
      - PORT=4000
    networks:
      - vitatrack-network

  # 2. VitaTrack Admin Operations Web Portal
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: vitatrack-admin
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - vitatrack-network

networks:
  vitatrack-network:
    driver: bridge
