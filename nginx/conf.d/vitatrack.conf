# ==============================================================================
# VitaTrack Scalability Architecture: Reverse Proxy & Load Balancer Specification
# Docs Reference: docs/HUMAN_UI_GUEST_REVAMP_SPEC.md §6.2 & docs/ARCHITECTURE.md §7
# ==============================================================================

# Upstream Node.js Application Cluster
upstream backend_cluster {
    # Load Balancing Algorithm: least_conn directs traffic to the least busy server
    least_conn;

    # Primary API Instances (scale out with docker-compose up --scale backend=3)
    server backend:4000 max_fails=3 fail_timeout=10s;

    # Connection keepalive pool to upstream Express Node instances
    keepalive 64;
}

# Upstream Admin Operations Portal
upstream admin_portal {
    server admin:5173 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80) — Redirect to HTTPS & ACME Challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name vitatrack.internal api.vitatrack.internal admin.vitatrack.internal localhost;

    # Health Check Endpoint for Infrastructure Probes (HTTP 200 OK without redirect)
    location /health {
        proxy_pass http://backend_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # Development / Testing bypass (allows HTTP when SSL certs are deferred)
    location / {
        # Production: Uncomment to force HTTPS redirect
        # return 301 https://$host$request_uri;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server (Port 443) — TLS 1.3 Termination & Security Boundary
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.vitatrack.internal vitatrack.internal;

    # SSL / TLS 1.3 Certificate Configuration
    # In production, mount Let's Encrypt or Corporate PKI certificates
    ssl_certificate /etc/nginx/certs/vitatrack.crt;
    ssl_certificate_key /etc/nginx/certs/vitatrack.key;

    # High-Security TLS Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers (Defense-in-depth along with Helmet)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Health Check Proxy with Fast Timeout
    location /health {
        proxy_pass http://backend_cluster/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # API Routes Proxy (Preserving client IPs for Redis rate limiters)
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Buffering & Timeouts
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Pass RateLimit headers through to client
        proxy_pass_header RateLimit-Limit;
        proxy_pass_header RateLimit-Remaining;
        proxy_pass_header RateLimit-Reset;
    }

    # Default Fallback Route
    location / {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
