# ==============================================================================
# VitaTrack Render Blueprint — 100% FREE TIER (No Credit Card / Payment Required)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. VitaTrack Express REST API Backend (100% Free Plan)
  # ----------------------------------------------------------------------------
  - type: web
    name: vitatrack-backend
    runtime: node
    plan: free # 100% Free Tier — Zero Credit Card Required
    rootDir: apps/backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: MONGO_URI
        sync: false # Paste your MongoDB Atlas URI in Render dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: REDIS_URL
        sync: false # Paste free Upstash Redis URL: rediss://default:...@...upstash.io:6379

  # ----------------------------------------------------------------------------
  # 2. VitaTrack Admin Operations Web Portal (100% Free Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: vitatrack-admin
    runtime: static
    rootDir: apps/admin
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: rewrite
        source: /admin/*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vitatrack-backend
          property: host
