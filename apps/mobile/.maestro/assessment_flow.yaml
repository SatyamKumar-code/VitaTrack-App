appId: com.vitatrack.health
---
# VitaTrack Maestro Automated Flow: Complete Assessment & Scoring (TC-UI-01)
- launchApp:
    clearState: false

# 1. Start Assessment Survey
- assertVisible: "VitaTrack"
- tapOn: "Start Assessment"

# 2. Step 1: Symptom Evaluation
- assertVisible: "Fatigue & Energy"
- tapOn: "Severe"
- tapOn: "Next Step"

# 3. Step 2: Musculoskeletal Health
- assertVisible: "Bone Pain & Muscle Weakness"
- tapOn: "Moderate"
- tapOn: "Next Step"

# 4. Step 3: Sunlight & Outdoor Exposure
- assertVisible: "Sunlight Exposure"
- tapOn: "Minimal (< 10 minutes)"
- tapOn: "Next Step"

# 5. Step 4: Dietary Habits
- assertVisible: "Dietary Habits"
- tapOn: "Rarely / Never"
- tapOn: "Calculate Risk Score"

# 6. Verify Results Gauge & Clinical Framing
- assertVisible: "Deficiency Risk Stratification"
- assertVisible: "Doctor Consultation Recommended"
- assertVisible: "Educational Aid Only"
